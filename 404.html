<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found · Despina Ioannide</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
  (function(){
    var t = localStorage.getItem('site-theme') || 'dark';
    if(t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --grad-top: #f8ded3;
    --grad-mid: #f0ae93;
    --grad-bottom: #dd7a58;

    --bg: #fdf3ec;
    --ink: #2b2019;
    --ink-dim: #6f5b4c;
    --ink-faint: #a4917f;
    --hero-ink: #fffaf5;
    --hero-ink-dim: rgba(255,250,245,0.86);

    --accent: #d9714a;
    --accent-deep: #b85535;
    --line-strong: rgba(43,32,25,0.24);
    --hero-glow: rgba(184,85,53,0.6);

    --display: 'Space Grotesk', 'Jost', sans-serif;
    --body-serif: 'Inter', 'Jost', sans-serif;
    --label: 'Jost', 'Inter', sans-serif;
  }

  :root[data-theme="dark"]{
    --grad-top: #260c31;
    --grad-mid: #671372;
    --grad-bottom: #7a3c22;

    --bg: #16120e;
    --ink: #f1e6db;
    --ink-dim: #c4b3a2;
    --ink-faint: #8d7a68;
    --line-strong: rgba(241,230,219,0.22);

    --accent: #e8935f;
    --accent-deep: #f0a877;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(165deg, var(--grad-top) 0%, var(--grad-mid) 55%, var(--grad-bottom) 100%);
    font-family: var(--body-serif);
    text-align: center;
    padding: 40px;
    -webkit-font-smoothing: antialiased;
  }

  .code{
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(4rem, 14vw, 8rem);
    line-height: 1;
    color: var(--hero-ink);
    text-shadow: 0 0 20px var(--hero-glow), 0 3px 8px var(--hero-glow);
    margin-bottom: 8px;
  }
  .msg{
    font-size: 1.15rem;
    color: var(--hero-ink);
    text-shadow: 0 0 12px var(--hero-glow), 0 1px 4px var(--hero-glow);
    max-width: 420px;
    margin: 0 auto 34px;
  }
  .btn{
    font-family: var(--label);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 13px 26px;
    border-radius: 999px;
    background: var(--hero-ink);
    color: #2b2019;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: transform 0.2s ease;
  }
  .btn:hover{ transform: translateY(-2px); }
</style>
</head>
<body>

  <div>
    <div class="code">404</div>
    <p class="msg">This page drifted off somewhere, the link might be old or mistyped. Let's get you back on course.</p>
    <a class="btn" href="/">Back to the portfolio ↗</a>
  </div>

</body>
</html>
